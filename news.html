{% extends "index.html" %}

{% block content %}
    <h1>Welcome back, {{ username }}!</h1>
    <p>Last Updated: {{ last_updated }}</p>

    <h2>Current Cybersecurity News</h2>
    <ul>
        {% for article in articles %}
            <li>
                <strong>{{ article.title }}</strong>
                <p>{{ article.summary }}</p>
            </li>
        {% endfor %}
    </ul>
{% endblock %}
