{% extends "index.html" %}

{% block content %}
<h2>Create an account</h2>
<p>New accounts are created with the User role.</p>
{% if error %}
    <p role="alert">{{ error }}</p>
{% endif %}
<form action="{{ url_for('register') }}" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div>
        <label for="username">Username</label>
        <input type="text" id="username" name="username" maxlength="80" autocomplete="username" value="{{ username }}" required>
    </div>
    <div>
        <label for="password">Password (at least 8 characters)</label>
        <input type="password" id="password" name="password" minlength="8" autocomplete="new-password" required>
    </div>
    <button type="submit">Register</button>
</form>
<p>Already registered? <a href="{{ url_for('cookie_check') }}">Sign in</a>.</p>
{% endblock %}
